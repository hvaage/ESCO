name: Import SSB industry benchmark tables

on:
  workflow_dispatch:
    inputs:
      table_id:
        description: Optional single SSB table id to import
        required: false
        type: string
      group:
        description: Table group to import when table_id is empty
        required: false
        default: all
        type: choice
        options:
          - all
          - phase1
          - naeringer
      all_years:
        description: Import all available years for the selected table set
        required: false
        default: false
        type: boolean
  schedule:
    # SSB tables are annual, but publication dates vary. A monthly idempotent
    # check catches new vintages without reimporting unnecessary history.
    - cron: "20 7 14 * *"
    # Temporary catch-up checks for SSB's September 2026 publications:
    # 25 Sep: Regnskap for ikke-finansielle aksjeselskaper 2025.
    # 29 Sep: Føretak 2024.
    - cron: "20 7 26,30 9 *"

concurrency:
  group: ssb-industry-benchmark-tables
  cancel-in-progress: false

jobs:
  import-ssb-industry-benchmark-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Decide whether this scheduled import should run
        id: run_window
        shell: bash
        run: |
          should_run=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "20 7 26,30 9 *" ]; then
            current_date="$(date -u +%Y-%m-%d)"
            case "$current_date" in
              2026-09-26|2026-09-30)
                ;;
              *)
                should_run=false
                ;;
            esac
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.run_window.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Verify database secret
        if: steps.run_window.outputs.should_run == 'true'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SUPABASE_DATABASE_URL GitHub secret is required." >&2
            exit 2
          fi

      - name: Apply migrations
        if: steps.run_window.outputs.should_run == 'true'
        run: python scripts/apply_migrations.py

      - name: Import SSB industry benchmark tables
        if: steps.run_window.outputs.should_run == 'true'
        run: |
          args=()
          if [ -n "${{ github.event.inputs.table_id }}" ]; then
            args+=(--table-id "${{ github.event.inputs.table_id }}")
          elif [ -n "${{ github.event.inputs.group }}" ]; then
            args+=(--group "${{ github.event.inputs.group }}")
          fi
          if [ "${{ github.event.inputs.all_years }}" = "true" ]; then
            args+=(--all-years)
          fi
          python scripts/import_ssb_industry_benchmark_tables.py "${args[@]}"
